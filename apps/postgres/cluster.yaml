apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 1
  bootstrap:
    initdb:
      database: app
      owner: app
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: keycloak-db-credentials
      - name: lead_intake
        ensure: present
        login: true
        connectionLimit: 10
        passwordSecret:
          name: lead-intake-db-credentials
      - name: attorney_api
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret:
          name: attorney-api-db-credentials
      - name: notification_worker
        ensure: present
        login: true
        connectionLimit: 10
        passwordSecret:
          name: notification-worker-db-credentials
  storage:
    size: 1Gi