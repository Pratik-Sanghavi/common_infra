apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: common-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/common_infra.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
