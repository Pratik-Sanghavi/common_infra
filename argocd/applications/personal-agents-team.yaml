apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-agents-team
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/haarishmk26/Build_personal_agents_team_GF.git
    targetRevision: personal-agents
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: personal-agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true