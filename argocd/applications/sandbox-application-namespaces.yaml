apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-application-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/sandbox-application.git
    targetRevision: main
    path: namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
