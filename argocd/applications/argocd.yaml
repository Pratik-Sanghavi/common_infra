apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: common-infra
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.0
    helm:
      releaseName: argocd
      valuesObject:
        configs:
          cmp:
            create: true
            plugins:
              sops-kustomize:
                discover:
                  find:
                    command:
                      - sh
                      - -c
                      - find . -type f -name '*.sops.yaml' -print -quit | grep -q .
                generate:
                  command:
                    - sh
                    - -c
                  args:
                    - |
                      set -eu
                      find . -type f -name '*.sops.yaml' -exec sh -c '
                        for file do
                          decrypted="${file%.sops.yaml}.yaml"
                          sops --decrypt --output "$decrypted" "$file"
                        done
                      ' sh {} +
                      kustomize build .
        repoServer:
          extraContainers:
            - name: sops-kustomize
              image: localhost:5000/common-infra/argocd-sops-cmp@sha256:338c6d36c177bb26472a6bf0d1e270f32ac318b616d51eb6cfaef05f7d61c366
              imagePullPolicy: IfNotPresent
              command:
                - /var/run/argocd/argocd-cmp-server
              env:
                - name: SOPS_AGE_KEY_FILE
                  value: /home/argocd/.config/sops/age/keys.txt
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 999
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: var-files
                  mountPath: /var/run/argocd
                - name: plugins
                  mountPath: /home/argocd/cmp-server/plugins
                - name: argocd-cmp-cm
                  mountPath: /home/argocd/cmp-server/config/plugin.yaml
                  subPath: sops-kustomize.yaml
                - name: sops-age
                  mountPath: /home/argocd/.config/sops/age
                  readOnly: true
                - name: sops-kustomize-tmp
                  mountPath: /tmp
          volumes:
            - name: argocd-cmp-cm
              configMap:
                name: argocd-cmp-cm
            - name: sops-age
              secret:
                secretName: sops-age
                optional: true
            - name: sops-kustomize-tmp
              emptyDir: {}
        server:
          service:
            type: LoadBalancer
            nodePortHttps: 30443
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
