apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: law-application-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/common_infra.git
    targetRevision: main
    path: apps/law-application-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: law-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true