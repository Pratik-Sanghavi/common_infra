apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: law-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/law-application.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: law-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
