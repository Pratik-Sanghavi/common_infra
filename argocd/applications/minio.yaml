apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        mode: standalone
        replicas: 1
        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          size: 20Gi
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        service:
          type: ClusterIP
        consoleService:
          type: ClusterIP
        policies:
          - name: lead-api-resume-access
            statements:
              - resources:
                  - arn:aws:s3:::lead-resumes
                actions:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
              - resources:
                  - arn:aws:s3:::lead-resumes/*
                actions:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
        users:
          - accessKey: lead-api
            secretKey: lead-api-local-s3-secret
            policy: lead-api-resume-access
        buckets:
          - name: lead-resumes
            policy: none
            purge: false
            versioning: false
            objectlocking: false
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true