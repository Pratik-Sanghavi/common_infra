apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-application-transparent-capture-injector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/sandbox-application.git
    targetRevision: HEAD
    path: sandbox-system/transparent-capture-injector/manifests
    plugin:
      name: sops-kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox-system-ns-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
