apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: procurement-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Pratik-Sanghavi/procurement-application.git
    targetRevision: pratik/submission
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: procurement-ns-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true