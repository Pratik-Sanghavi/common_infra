apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis
    targetRevision: 28.0.15
    helm:
      enableOCI: true
      valuesObject:
        architecture: standalone
        auth:
          enabled: true
          existingSecret: redis-credentials
          existingSecretPasswordKey: redis-password
        master:
          persistence:
            enabled: true
            accessModes:
              - ReadWriteOnce
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-ns-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true