apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.4.0
    helm:
      releaseName: keycloak
      values: |
        fullnameOverride: keycloak
        replicas: 1
        command:
          - /opt/keycloak/bin/kc.sh
        args:
          - start-dev
        image:
          repository: quay.io/keycloak/keycloak
          tag: "26.8.1"
        service:
          type: LoadBalancer
          httpPort: 8082
        http:
          enabled: true
          relativePath: /
        database:
          vendor: postgres
          hostname: postgres-rw.database.svc.cluster.local
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db-credentials
          existingSecretKey: password
        extraEnv: |
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin-credentials
                key: admin-password
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true